[package]
name = "newtype"
version = "0.2.1"
description = "AI voice input"
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

[lib]
name = "newtype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "net", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "blocking", "rustls-tls"] }
cpal = "0.15"
rdev = "0.5"
regex = "1"
pinyin = "0.10"
base64 = "0.22"
sha2 = "0.10"
tar = "0.4"
bzip2 = "0.4"
flate2 = "1"
zip = "2"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
window-vibrancy = "0.8"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_NetworkManagement_IpHelper",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
semver = "1"
