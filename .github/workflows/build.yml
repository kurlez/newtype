name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# github.run_number for this file is the dev build number. Renaming the file resets it.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# contents: read is the default. Jobs that upload or download artifacts add the
# actions scope they need. Pull requests never receive signing or publish secrets,
# including pull requests from forks.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            bundles: app,dmg
          - name: windows-x64
            os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Require Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustc_version="$(rustc -vV)"
          printf '%s\n' "$rustc_version"
          case "$rustc_version" in
            *"host: aarch64-apple-darwin"*) ;;
            *)
              echo "rustc host is not aarch64-apple-darwin." >&2
              exit 1
              ;;
          esac

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Test version and release scripts
        run: npm test

      - name: Repair cached sherpa-onnx libraries
        shell: bash
        run: |
          set -euo pipefail
          root="src-tauri/target/sherpa-onnx-prebuilt"
          if [ ! -d "$root" ]; then
            exit 0
          fi
          found="$(find "$root" \( -name 'libsherpa-onnx-c-api.a' -o -name 'sherpa-onnx-c-api.lib' -o -name 'libsherpa-onnx-c-api.lib' \) -print | head -n 1)"
          if [ -z "$found" ]; then
            echo "Cached sherpa-onnx directory has no static library. Removing it so the build downloads the archive."
            rm -rf "$root"
          fi

      - name: Test the dictation pipeline
        working-directory: src-tauri
        run: cargo test --lib

      - name: Ephemeral updater key
        if: github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        run: |
          set -euo pipefail
          echo "This build signs with a throwaway key. Repository secrets are not used, and the signature is not published."
          node node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w "$RUNNER_TEMP/ephemeral-updater.key" -f
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/ephemeral-updater.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Updater signing key
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY}"
            if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
              echo "::add-mask::${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
            fi
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<NEWTYPE_KEY"
              printf '%s\n' "${TAURI_SIGNING_PRIVATE_KEY}"
              echo "NEWTYPE_KEY"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<NEWTYPE_PASS"
              printf '%s\n' "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
              echo "NEWTYPE_PASS"
            } >> "$GITHUB_ENV"
            echo "Using TAURI_SIGNING_PRIVATE_KEY from repository secrets."
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret. Generating an ephemeral key so the bundle step can run."
            echo "This build's updater signature will not match the committed public key and must not be published."
            node node_modules/@tauri-apps/cli/tauri.js signer generate --ci -w "$RUNNER_TEMP/ephemeral-updater.key" -f
            echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/ephemeral-updater.key" >> "$GITHUB_ENV"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
          fi

      - name: macOS signing identity
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/import-macos-identity.sh

      - name: Build
        run: node scripts/with-version.mjs -- build --bundles ${{ matrix.bundles }}

      - name: Check macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/verify-macos-signature.sh

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp build-meta.json dist-release/
          find src-tauri/target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \) \
            -exec cp {} dist-release/ \;
          find dist-release -maxdepth 1 -type f -print

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-release
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Secrets present
        id: gate
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NEWTYPE_RELEASES_TOKEN: ${{ secrets.NEWTYPE_RELEASES_TOKEN }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$NEWTYPE_RELEASES_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Updater publish skipped::Publishing needs TAURI_SIGNING_PRIVATE_KEY and NEWTYPE_RELEASES_TOKEN. See SETUP.md."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and publish
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.NEWTYPE_RELEASES_TOKEN }}
        run: node scripts/publish-release.mjs --artifacts artifacts
